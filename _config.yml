# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: Michael Brown
email: mb@mfbrown.me
description: "Michael Brown's personal blog about product management, AI, public transportation, aviation and more."
# jekyll-seo-tag builds the home page <title> as "title | tagline", falling back
# to the full description — which overruns what search results display.
tagline: "Writing on product, AI, transit and aviation"
author: Michael Brown
lang: en
baseurl: ""
# Must match CNAME. Without it canonical links and the Atom feed's <id> elements
# are emitted as relative paths, which is invalid.
url: "https://mfbrown.me"
# twitter_username: mfbrown
# github_username:  mfbrown

# Build settings
markdown: kramdown
# `gems:` was the pre-3.5 key. All three plugins ship with the github-pages gem
# and are on GitHub Pages' allowlist, so they run on deploy as well as locally.
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
exclude:
  - Gemfile
  - Gemfile.lock
  # Font licence/specimen PDFs. Shipped with the typefaces, never linked from
  # the site, and jekyll-sitemap would otherwise list them as indexable pages.
  - assets/fonts/bebas/FFF_EULA_license.pdf
  - assets/fonts/bebas/Glober Pro Specimen.pdf
  - assets/fonts/source-sans-pro/SIL Open Font License.txt

sass:
  sass_dir: _scss

# Split-flap board.
#
# `topics` keys match the `topic:` front matter on each post. Deliberately not
# `category:` — Jekyll's default permalink is /:categories/:year/:month/:day/:title
# so a `category:` key would rewrite every post URL.
board:
  title: ARRIVALS
  topics:
    product:
      code: PM
      label: PRODUCT
    ai:
      code: AI
      label: AI
    transit:
      code: TR
      label: TRANSIT
    aviation:
      code: AV
      label: AVIATION